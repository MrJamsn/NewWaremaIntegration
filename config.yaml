name: "Warema WMS Bridge (Python)"
description: "Controls Warema WMS blinds via USB Stick - MQTT bridge"
version: "1.0.0"
slug: "warema_wms_py"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
homeassistant_api: false
hassio_api: false
host_network: false
map:
  - share:rw
uart: true
devices:
  - /dev/ttyUSB0

options:
  mqtt_server: "mqtt://homeassistant"
  mqtt_port: 1883
  mqtt_user: ""
  mqtt_password: ""
  wms_serial_port: "/dev/ttyUSB0"
  wms_channel: 17
  wms_pan_id: "FFFF"
  wms_key: "00112233445566778899AABBCCDDEEFF"
  polling_interval: 30
  moving_interval: 2
  ignored_devices: ""
  force_devices: ""
  log_level: "info"

schema:
  mqtt_server: str
  mqtt_port: int
  mqtt_user: str
  mqtt_password: str
  wms_serial_port: str
  wms_channel: int
  wms_pan_id: str
  wms_key: str
  polling_interval: int
  moving_interval: int
  ignored_devices: str
  force_devices: str
  log_level: list(debug|info|warning|error)
